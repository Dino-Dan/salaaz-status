<!-- salaaz-custom-status-page: do not let Upptime's generated Sapper site overwrite this on gh-pages -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salaaz Status</title>
  <meta name="description" content="Live status and uptime for all Salaaz services — Marketplace and Vendor Portal.">
  <meta property="og:title" content="Salaaz Status">
  <meta property="og:description" content="Live status and uptime for all Salaaz services.">
  <meta property="og:url" content="https://status.salaaz.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://salaaz.com/logo.png">
  <link rel="canonical" href="https://status.salaaz.com/">
  <link rel="icon" type="image/png" href="https://salaaz.com/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink-1: #1A2E0F;
      --ink-2: #2F4A1C;
      --ink-3: #5C6F4A;
      --paper-1: #FAF8F2;
      --paper-2: #F3EFE3;
      --paper-3: #E8E2CE;
      --leaf-50: #EAF3DE;
      --leaf: #4F7A1B;
      --leaf-deep: #2C5F2D;
      --rose: #8E3A47;
      --rose-soft: #F1E0E4;
      --rule: rgba(26,46,15,0.12);
      --rule-2: rgba(26,46,15,0.22);
      --focus-ring: 0 0 0 3px rgba(44,95,45,0.12);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    html, body {
      background: var(--paper-1);
      color: var(--ink-1);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      background: var(--paper-2);
      border-bottom: 0.5px solid var(--rule-2);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--ink-1);
      text-decoration: none;
    }

    .nav-links a {
      font-size: 0.8rem;
      color: var(--ink-3);
      text-decoration: none;
      font-weight: 500;
      margin-left: 1.25rem;
      transition: color 120ms linear;
    }

    .nav-links a:hover { color: var(--ink-1); }

    /* ── Layout ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Status Banner ── */
    .status-banner {
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      border: 0.5px solid;
    }

    .status-banner.all-up   { background: var(--leaf-50); border-color: var(--leaf); }
    .status-banner.some-down { background: var(--rose-soft); border-color: var(--rose); }
    .status-banner.degraded  { background: var(--paper-2); border-color: var(--rule-2); }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .dot-green  { background: var(--leaf); }
    .dot-red    { background: var(--rose); }
    .dot-amber  { background: var(--ink-2); }

    .banner-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: -0.005em;
    }

    .all-up .banner-title    { color: var(--leaf-deep); }
    .some-down .banner-title { color: var(--rose); }
    .degraded .banner-title  { color: var(--ink-2); }

    .banner-sub {
      font-size: 0.8rem;
      color: var(--ink-3);
      margin-top: 1px;
    }

    /* ── Last checked ── */
    .last-checked {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--ink-3);
      text-align: right;
      margin-bottom: 0.6rem;
    }

    /* ── Section label ── */
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.6rem;
    }

    /* ── Service Cards ── */
    .card {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      margin-bottom: 0.4rem;
      overflow: hidden;
      transition: border-color 120ms linear;
    }
    .card:hover { border-color: var(--rule-2); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
    }

    .service-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .service-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .service-name {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.005em;
      color: var(--ink-1);
    }

    .service-url {
      font-size: 0.73rem;
      color: var(--ink-3);
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.25em 0.75em;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      border: 0.5px solid transparent;
    }

    .tag-up       { background: var(--leaf-50); color: var(--leaf-deep); border-color: rgba(44,95,45,0.16); }
    .tag-down     { background: var(--rose-soft); color: var(--rose); border-color: rgba(142,58,71,0.18); }
    .tag-degraded { background: var(--paper-3); color: var(--ink-1); border-color: var(--rule-2); }

    /* ── Bar strip ── */
    .bar-section {
      padding: 0 1.25rem 0.9rem;
    }

    .bar-strip {
      display: flex;
      gap: 2px;
      height: 20px;
      overflow: hidden;
      width: 100%;
    }

    .bar {
      flex: 1 1 0;
      min-width: 0;
      border-radius: 2px;
      cursor: default;
      transition: opacity 0.1s;
    }

    .bar:hover { opacity: 0.7; }

    .bar-legend {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .bar-legend span {
      font-size: 0.67rem;
      color: var(--ink-3);
    }

    .uptime-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .uptime-pct {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    /* ── Legend ── */
    .color-legend {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      color: var(--ink-3);
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    hr {
      border: none;
      border-top: 0.5px solid var(--rule-2);
      margin: 2rem 0;
    }


    /* ── Skeleton loader ── */
    .skeleton-card {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.6rem;
    }

    .skeleton-line {
      border-radius: 4px;
      background: linear-gradient(90deg, var(--paper-3) 25%, #DDD6BC 50%, var(--paper-3) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      background: var(--ink-1);
      color: var(--paper-1);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.3em 0.6em;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
      z-index: 1000;
      display: none;
    }

    /* ── Component toggle & panel ── */
    .card-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1.25rem;
      border-top: 0.5px solid var(--rule);
      cursor: pointer;
      user-select: none;
    }
    .card-toggle:hover { background: var(--paper-1); }

    .card-toggle-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--ink-3);
    }

    .card-toggle-chev {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--ink-3);
      border-bottom: 1.5px solid var(--ink-3);
      transform: rotate(45deg);
      transition: transform 120ms linear;
      flex-shrink: 0;
    }
    .card-toggle-chev.open { transform: rotate(-135deg); }

    .card-components {
      display: none;
      padding: 0.25rem 1.25rem 0.75rem;
      border-top: 0.5px solid var(--rule);
    }
    .card-components.visible { display: block; }

    .component-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.32rem 0;
      border-bottom: 0.5px solid var(--rule);
    }
    .component-row:last-child { border-bottom: none; }

    .component-name {
      font-size: 0.8rem;
      color: var(--ink-2);
    }

    .comp-badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 500;
      padding: 0.2em 0.55em;
      border-radius: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .comp-operational { background: var(--leaf-50); color: var(--leaf-deep); }
    .comp-degraded    { background: var(--paper-3); color: var(--ink-1); }
    .comp-planned     { background: var(--paper-1); color: var(--ink-3); }
    .comp-unknown     { background: var(--paper-1); color: var(--ink-3); }


    /* ── Planned service card ── */
    .card.is-planned { opacity: 0.82; }
    .tag-planned { background: var(--paper-1); color: var(--ink-3); }

    /* ── Past Incidents ── */
    .incidents-section { margin-top: 2.5rem; }

    .incidents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .incidents-header .view-all {
      font-size: 0.78rem;
      color: var(--leaf-deep);
      text-decoration: none;
    }
    .incidents-header .view-all:hover { text-decoration: underline; }

    .incident-day-heading {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 1.1rem 0 0.5rem;
    }
    .incident-day-heading:first-child { margin-top: 0; }

    .incident-row {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      padding: 0.875rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: border-color 120ms linear;
    }
    .incident-row:hover { border-color: var(--rule-2); }
    .incident-row-left { display: flex; align-items: center; gap: 0.625rem; }
    .incident-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); flex-shrink: 0; }
    .incident-service { font-family: var(--font-serif); font-size: 0.9rem; font-weight: 500; color: var(--ink-1); }
    .incident-detail { font-size: 0.78rem; color: var(--ink-3); margin-top: 0.1rem; }
    .incident-meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-3); white-space: nowrap; }
    .no-past-incidents { font-size: 0.8rem; color: var(--ink-3); padding: 1.5rem 0; text-align: center; }

    /* ── Footer ── */
    footer {
      border-top: 0.5px solid var(--rule-2);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-3);
      margin-top: 3rem;
    }

    footer a { color: var(--ink-3); text-decoration: none; }
    footer a:hover { color: var(--ink-1); }

    /* ── Pulsing dot for live incidents ── */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .dot-pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .dot-pulse { animation: none; } }

    @media (max-width: 600px) {
      main { padding: 1.25rem 1rem 3rem; }
      .card-header { padding: 0.875rem 1rem 0.625rem; }
      .bar-section { padding: 0 1rem 0.875rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <img src="https://salaaz.com/logo.png" alt="Salaaz" style="height:24px;width:auto;">
    Salaaz Status
  </a>
  <span id="nav-status-chip" style="font-size:0.72rem;font-weight:500;padding:0.2em 0.6em;border-radius:999px;display:none"></span>
  <div class="nav-links">
    <a href="incidents.html">Incidents</a>
  </div>
</nav>

<div id="tooltip"></div>

<main>
  <div id="banner">
    <!-- skeleton banner -->
    <div style="height:68px;border-radius:8px;margin-bottom:1.5rem" class="skeleton-line"></div>
  </div>

  <div class="last-checked" id="last-checked"></div>
  <div class="section-label">Services</div>

  <div id="services">
    <!-- skeleton cards -->
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:120px;margin-bottom:10px"></div>
      <div class="skeleton-line" style="height:20px;width:100%"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:140px;margin-bottom:10px"></div>
      <div class="skeleton-line" style="height:20px;width:100%"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:130px;margin-bottom:10px"></div>
      <div class="skeleton-line" style="height:20px;width:100%"></div>
    </div>
  </div>

  <div class="color-legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background:#4F7A1B"></div>Operational
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#2F4A1C"></div>Degraded
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#8E3A47"></div>Outage
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:#E8E2CE"></div>No data
    </div>
  </div>

  <div class="incidents-section">
    <div class="incidents-header">
      <div class="section-label" style="margin-bottom:0">Past Incidents</div>
      <a class="view-all" href="incidents.html">View all →</a>
    </div>
    <div id="past-incidents">
      <div class="skeleton-card" style="height:52px;margin-bottom:0.5rem"></div>
      <div class="skeleton-card" style="height:52px"></div>
    </div>
  </div>

</main>

<footer>
  © 2026 <a href="https://salaaz.com" target="_blank" rel="noopener">Salaaz</a>
</footer>

<script>
  const RAW = 'https://raw.githubusercontent.com/Dino-Dan/salaaz-status/master';

  // ── Internal-only services ──
  // Still monitored by Upptime and still alerted on internally, but never shown
  // on this public page. Filtered out as early as possible in the data flow so
  // the slug never reaches a network request or the status banner.
  const HIDDEN_SLUGS = ['ethics-dashboard'];
  const HIDDEN_SERVICE_NAMES = ['Ethics Dashboard'];

  // ── Sub-components per Upptime slug (disabled — re-enable when per-component monitoring is wired up) ──
  /* const SUB_COMPONENTS = {
    'salaaz-marketplace': [
      'Authentication',
      'Product Catalog & Browse',
      'Search',
      'Cart',
      'Wishlist',
      'Checkout',
      'Payments',
      'Order Management',
      'Shipping & Tracking',
      'Vendor Storefronts',
      'Ethics Ratings',
      'Multi-currency',
    ],
    'vendor-portal': [
      'Authentication',
      'Dashboard Overview',
      'Inventory Management',
      'Bulk Product Upload',
      'Order Management',
      'Storefront Builder',
      'Analytics & Reporting',
      'Onboarding & Certifications',
      'Account Settings',
    ],
  }; */
  const SUB_COMPONENTS = {};

  const PLANNED_SERVICES = [];

  // ── Third-party dependency providers (shown under Salaaz Marketplace) ──
  const DEPS = [
    {
      label: 'Shipping',
      type: 'repojson',
      apiUrl: RAW + '/history/stallion-status.json',
    },
    {
      label: 'Payments',
      type: 'repojson',
      apiUrl: RAW + '/history/square-status.json',
    },
    {
      label: 'API',
      type: 'repojson',
      apiUrl: RAW + '/history/alibaba-ecs-status.json',
    },
    {
      label: 'Vendor Portal',
      type: 'repojson',
      apiUrl: RAW + '/history/vendor-portal-render-status.json',
    },
  ];

  function indicatorToStatus(indicator) {
    if (indicator === 'none') return 'up';
    return 'degraded'; // cap at degraded — provider outages never show red on our page
  }

  async function fetchDepsStatus() {
    return Promise.all(DEPS.map(async function (dep) {
      try {
        if (dep.type === 'statuspage') {
          const data = await fetch(dep.apiUrl).then(function (r) { return r.json(); });
          return Object.assign({}, dep, { status: indicatorToStatus(data.status.indicator) });
        }
        if (dep.type === 'repojson') {
          const data = await fetch(cacheBust(dep.apiUrl)).then(function (r) { return r.json(); });
          return Object.assign({}, dep, { status: data.status || 'unknown' });
        }
      } catch (_) {}
      return Object.assign({}, dep, { status: 'unknown' });
    }));
  }

  function appendDepsPanel(card, deps) {
    const toggle = document.createElement('div');
    toggle.className = 'card-toggle';
    toggle.setAttribute('role', 'button');
    toggle.setAttribute('tabindex', '0');
    toggle.setAttribute('aria-expanded', 'false');

    const label = document.createElement('span');
    label.className = 'card-toggle-label';
    label.textContent = 'Dependencies (' + deps.length + ')';

    const chev = document.createElement('span');
    chev.className = 'card-toggle-chev';

    toggle.appendChild(label);
    toggle.appendChild(chev);

    const panel = document.createElement('div');
    panel.className = 'card-components';

    deps.forEach(function (dep) {
      const statusMap = {
        up:       { cls: 'comp-operational', text: 'Operational' },
        degraded: { cls: 'comp-degraded',    text: 'Degraded'    },
        unknown:  { cls: 'comp-unknown',     text: 'Unknown'     },
      };
      const s = statusMap[dep.status] || statusMap.unknown;

      const row = document.createElement('div');
      row.className = 'component-row';

      const nameEl = document.createElement('span');
      nameEl.className = 'component-name';
      nameEl.textContent = dep.label;

      const badge = document.createElement('span');
      badge.className = 'comp-badge ' + s.cls;
      badge.textContent = s.text;

      row.appendChild(nameEl);
      row.appendChild(badge);
      panel.appendChild(row);
    });

    function togglePanel() {
      const open = panel.classList.toggle('visible');
      chev.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    toggle.addEventListener('click', togglePanel);
    toggle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePanel(); }
    });

    card.appendChild(toggle);
    card.appendChild(panel);
  }

  const VENDOR_PORTAL_ICON = 'data:image/svg+xml;base64,' + btoa(
    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Salaaz Workbench">' +
    '<defs>' +
    '<path id="workbench-brandmark-dark-leaf-outer" d="M 100,22 C 116,30 116,58 116,68 C 116,82 110,92 100,98 C 90,92 84,82 84,68 C 84,58 84,30 100,22 Z"/>' +
    '<path id="workbench-brandmark-dark-leaf-inner" d="M 100,52 C 112,58 112,75 112,81 C 112,90 107.5,96.5 100,100 C 92.5,96.5 88,90 88,81 C 88,75 88,58 100,52 Z"/>' +
    '</defs>' +
    '<g fill="#8E4E3C" fill-opacity="0.85" stroke="#A85842" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">' +
    '<use href="#workbench-brandmark-dark-leaf-outer"/>' +
    '<use href="#workbench-brandmark-dark-leaf-outer" transform="rotate(60 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-outer" transform="rotate(120 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-outer" transform="rotate(180 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-outer" transform="rotate(240 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-outer" transform="rotate(300 100 100)"/>' +
    '</g>' +
    '<g fill="none" stroke="#D67B5E" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">' +
    '<use href="#workbench-brandmark-dark-leaf-inner" transform="rotate(30 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-inner" transform="rotate(90 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-inner" transform="rotate(150 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-inner" transform="rotate(210 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-inner" transform="rotate(270 100 100)"/>' +
    '<use href="#workbench-brandmark-dark-leaf-inner" transform="rotate(330 100 100)"/>' +
    '</g>' +
    '</svg>'
  );
  const tooltip = document.getElementById('tooltip');

  // ── Tooltip ──
  document.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 32) + 'px';
  });

  function showTip(text) { tooltip.textContent = text; tooltip.style.display = 'block'; }
  function hideTip()      { tooltip.style.display = 'none'; }

  // ── Helpers ──
  function localDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function localToday() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function formatDisplay(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d)
      .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ── Bar status for a given date ──
  function dayStatus(dateStr, startDate, dailyMinutesDown) {
    const d = new Date(dateStr + 'T00:00:00Z');
    if (!startDate || d < startDate) return 'nodata';
    const mins = (dailyMinutesDown || {})[dateStr] || 0;
    if (mins >= 720) return 'down';
    if (mins > 0)    return 'degraded';
    return 'up';
  }

  function barColor(status) {
    return { up: '#4F7A1B', degraded: '#2F4A1C', down: '#8E3A47', nodata: '#E8E2CE' }[status];
  }

  function barLabel(dateStr, status, mins) {
    const d = formatDisplay(dateStr);
    if (status === 'nodata')   return `${d}: No data`;
    if (status === 'down')     return `${d}: Outage — ${mins} min down`;
    if (status === 'degraded') return `${d}: Degraded — ${mins} min down`;
    return `${d}: Operational`;
  }

  // ── Fetch live status + start date from history YAML ──
  // The individual YAML files are always written first by Upptime and are
  // more up-to-date than summary.json, which can hold a stale status from
  // a previous check cycle. We use the YAML status as the source of truth.
  function cacheBust(url) { return url + '?_=' + Date.now(); }

  async function fetchYamlData(slug) {
    try {
      const text = await fetch(cacheBust(`${RAW}/history/${slug}.yml`)).then(r => r.text());
      const startMatch        = text.match(/startTime:\s*(\S+)/);
      const statusMatch       = text.match(/^status:\s*(\S+)/m);
      const lastUpdatedMatch  = text.match(/lastUpdated:\s*(\S+)/);
      const responseTimeMatch = text.match(/responseTime:\s*(\d+)/);
      const startDate = startMatch ? (function() {
        const d = new Date(startMatch[1]);
        return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      })() : null;
      const lastUpdated  = lastUpdatedMatch  ? new Date(lastUpdatedMatch[1])  : null;
      const responseTime = responseTimeMatch ? Number(responseTimeMatch[1])   : null;
      return { startDate, status: statusMatch ? statusMatch[1] : null, lastUpdated, responseTime };
    } catch (_) {}
    return { startDate: null, status: null, lastUpdated: null, responseTime: null };
  }

  // ── Render one service card ──
  function renderCard(service, startDate, lastUpdated, responseTime) {
    const today = localToday();
    const dm = service.dailyMinutesDown || {};

    // Build 90-day array — use local date arithmetic (setDate, not setUTCDate)
    const days = [];
    for (let i = 89; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const ds = localDateStr(d);
      const status = dayStatus(ds, startDate, dm);
      const mins = dm[ds] || 0;
      days.push({ ds, status, mins });
    }

    // If the service is live-down/degraded but no downtime recorded yet for today
    // (incident still open), immediately show today's bar as amber and estimate elapsed mins
    const todayBar = days[days.length - 1];
    if (todayBar && todayBar.status === 'up' && service.status !== 'up') {
      todayBar.status = 'degraded';
      todayBar.live = true;
      if (lastUpdated) {
        todayBar.mins = Math.max(0, Math.round((Date.now() - lastUpdated.getTime()) / 60000));
        todayBar.liveTime = lastUpdated.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
    }

    const isUp     = service.status === 'up';
    const isDown   = service.status === 'down';
    const tagClass = isUp ? 'tag-up' : isDown ? 'tag-down' : 'tag-degraded';
    const tagText  = isUp ? '✓ Operational' : isDown ? '✕ Down' : '⚠ Degraded';

    const card = document.createElement('div');
    card.className = 'card';

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';

    const hostname = (() => { try { return new URL(service.url).hostname; } catch(_) { return service.url; } })();

    const iconSrc = service.slug === 'vendor-portal'
      ? VENDOR_PORTAL_ICON
      : service.icon;

    // Wrap icon in fixed-size container so hiding it on error doesn't shift layout
    header.innerHTML = `
      <div class="service-info">
        <div style="width:18px;height:18px;flex-shrink:0">
          <img class="service-icon" src="${iconSrc}" onerror="this.style.visibility='hidden'" alt="">
        </div>
        <div>
          <div class="service-name">${service.name}</div>
          <div class="service-url">${hostname}</div>
        </div>
      </div>
      <span class="tag ${tagClass}" aria-label="${service.name} status: ${tagText.replace(/^[✓✕⚠]\s/, '')}">${tagText}</span>
    `;

    // Bar section
    const barSection = document.createElement('div');
    barSection.className = 'bar-section';

    const strip = document.createElement('div');
    strip.className = 'bar-strip';
    strip.setAttribute('role', 'img');
    strip.setAttribute('aria-label', `90-day uptime chart for ${service.name}`);

    days.forEach(({ ds, status, mins, live, liveTime }) => {
      const tipText = live
        ? `${formatDisplay(ds)}: Incident in progress${liveTime ? ' since ' + liveTime : ''}`
        : status === 'nodata'
          ? `${formatDisplay(ds)}: Monitoring not started yet`
          : barLabel(ds, status, mins);

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.background = barColor(status);
      bar.setAttribute('tabindex', '0');
      bar.setAttribute('aria-label', tipText);
      bar.addEventListener('mouseenter', () => showTip(tipText));
      bar.addEventListener('mouseleave', hideTip);
      bar.addEventListener('focus',  () => showTip(tipText));
      bar.addEventListener('blur',   hideTip);
      strip.appendChild(bar);
    });

    const legend = document.createElement('div');
    legend.className = 'bar-legend';
    legend.innerHTML = '<span>90 days ago</span><span>Today</span>';

    // Uptime = (90 days − total downtime) / 90 days, clamped 0–100
    const downMins = days.reduce((sum, d) => sum + d.mins, 0);
    const uptime90 = Math.min(100, Math.max(0, (90 * 1440 - downMins) / (90 * 1440) * 100)).toFixed(2) + '%';
    const responseText = isDown
      ? '—'
      : responseTime != null
        ? `${responseTime} ms`
        : service.time
          ? `${service.time} ms avg`
          : null;

    const uptimeRow = document.createElement('div');
    uptimeRow.className = 'uptime-row';
    uptimeRow.innerHTML = responseText
      ? `<span class="uptime-pct">${responseText} · ${uptime90} uptime (90 d)</span>`
      : `<span class="uptime-pct">${uptime90} uptime (90 d)</span>`;

    barSection.appendChild(strip);
    barSection.appendChild(legend);
    barSection.appendChild(uptimeRow);

    card.appendChild(header);
    card.appendChild(barSection);

    // ── Expandable sub-components (disabled) ──
    // const components = SUB_COMPONENTS[service.slug] || [];
    // if (components.length) { appendComponentPanel(card, components, service.status); }

    return card;
  }

  /* ── Shared helper: append toggle + panel to any card (disabled — re-enable when per-component monitoring is wired up) ──
  function appendComponentPanel(card, components, parentStatus) {
    const compStatus = parentStatus === 'down'    ? 'affected'
                     : parentStatus === 'degraded' ? 'degraded'
                     : parentStatus === 'planned'  ? 'planned'
                     : 'operational';
    const compLabel  = compStatus === 'affected'  ? 'Affected'
                     : compStatus === 'degraded'  ? 'Degraded'
                     : compStatus === 'planned'   ? 'Planned'
                     : 'Operational';

    const toggle = document.createElement('div');
    toggle.className = 'card-toggle';

    const toggleLabel = document.createElement('span');
    toggleLabel.className = 'card-toggle-label';
    toggleLabel.textContent = 'Components (' + components.length + ')';

    const chev = document.createElement('span');
    chev.className = 'card-toggle-chev';
    chev.textContent = '▾';

    toggle.appendChild(toggleLabel);
    toggle.appendChild(chev);

    const panel = document.createElement('div');
    panel.className = 'card-components';

    components.forEach(function (name) {
      const row = document.createElement('div');
      row.className = 'component-row';

      const nameEl = document.createElement('span');
      nameEl.className = 'component-name';
      nameEl.textContent = name;

      const badge = document.createElement('span');
      badge.className = 'comp-badge comp-' + compStatus;
      badge.textContent = compLabel;

      row.appendChild(nameEl);
      row.appendChild(badge);
      panel.appendChild(row);
    });

    toggle.addEventListener('click', function () {
      const open = panel.classList.toggle('visible');
      chev.classList.toggle('open', open);
    });

    card.appendChild(toggle);
    card.appendChild(panel);
  }
  ── */

  // ── Render a planned (not-yet-live) service card ──
  function renderPlannedCard(service) {
    const card = document.createElement('div');
    card.className = 'card is-planned';

    const header = document.createElement('div');
    header.className = 'card-header';

    const info = document.createElement('div');
    info.className = 'service-info';

    const textWrap = document.createElement('div');
    const nameEl = document.createElement('div');
    nameEl.className = 'service-name';
    nameEl.textContent = service.name;
    const urlEl = document.createElement('div');
    urlEl.className = 'service-url';
    urlEl.textContent = service.url;
    textWrap.appendChild(nameEl);
    textWrap.appendChild(urlEl);
    info.appendChild(textWrap);

    const badge = document.createElement('span');
    badge.className = 'tag tag-planned';
    badge.textContent = 'Planned';

    header.appendChild(info);
    header.appendChild(badge);
    card.appendChild(header);

    // appendComponentPanel(card, service.components, 'planned');
    return card;
  }

  // ── Render banner ──
  function renderBanner(services) {
    const allUp        = services.every(s => s.status === 'up');
    const downCount    = services.filter(s => s.status === 'down').length;
    const degradedCount = services.filter(s => s.status === 'degraded').length;
    const el = document.getElementById('banner');
    const chip = document.getElementById('nav-status-chip');

    if (allUp) {
      el.innerHTML = `<div class="status-banner all-up">
        <div class="status-dot dot-green dot-pulse"></div>
        <div>
          <div class="banner-title">All Systems Operational</div>
          <div class="banner-sub">Live status and uptime for all Salaaz services.</div>
        </div>
      </div>`;
      if (chip) { chip.textContent = '● All systems operational'; chip.style.color = '#2C5F2D'; chip.style.background = '#EAF3DE'; chip.style.display = ''; }
    } else if (downCount > 0) {
      let title = `${downCount} Service${downCount > 1 ? 's' : ''} Down`;
      if (degradedCount > 0) title += `, ${degradedCount} Degraded`;
      el.innerHTML = `<div class="status-banner some-down">
        <div class="status-dot dot-red dot-pulse"></div>
        <div>
          <div class="banner-title">${title}</div>
          <div class="banner-sub">We are investigating. <a href="incidents.html" style="color:inherit;text-decoration:underline;">View active incident →</a></div>
        </div>
      </div>`;
      if (chip) { chip.textContent = '● Outage'; chip.style.color = '#8E3A47'; chip.style.background = '#F1E0E4'; chip.style.display = ''; }
    } else {
      el.innerHTML = `<div class="status-banner degraded">
        <div class="status-dot dot-amber dot-pulse"></div>
        <div>
          <div class="banner-title">Some Systems Degraded</div>
          <div class="banner-sub">Performance may be affected. <a href="incidents.html" style="color:inherit;text-decoration:underline;">View active incident →</a></div>
        </div>
      </div>`;
      if (chip) { chip.textContent = '● Degraded'; chip.style.color = '#2F4A1C'; chip.style.background = '#F3EFE3'; chip.style.display = ''; }
    }
  }

  // ── Main ──
  async function init() {
    try {
      const [summary, depsData] = await Promise.all([
        fetch(cacheBust(`${RAW}/history/summary.json`)).then(r => {
          if (!r.ok) throw new Error('Failed to load summary');
          return r.json();
        }),
        fetchDepsStatus(),
      ]);

      // Drop internal-only services before anything else touches the data —
      // this keeps their slugs out of the YAML fetches below, out of the
      // banner math, and out of the rendered cards.
      const visible = summary.filter(s => !HIDDEN_SLUGS.includes(s.slug));

      const yamlData = await Promise.all(visible.map(s => fetchYamlData(s.slug)));

      // Override summary.json status with the live YAML status — the YAML is
      // written first by Upptime and is never stale from a previous check cycle.
      visible.forEach(function (service, i) {
        if (yamlData[i].status) service.status = yamlData[i].status;
      });

      renderBanner(visible);

      const shortFmt = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      document.getElementById('last-checked').textContent =
        'Last checked: ' + new Date().toLocaleString('en-US', shortFmt);

      const servicesEl = document.getElementById('services');
      servicesEl.innerHTML = '';
      visible.forEach((service, i) => {
        const card = renderCard(service, yamlData[i].startDate, yamlData[i].lastUpdated, yamlData[i].responseTime);
        if (service.slug === 'salaaz-marketplace') {
          appendDepsPanel(card, depsData);
        }
        servicesEl.appendChild(card);
      });
      PLANNED_SERVICES.forEach(function (s) {
        servicesEl.appendChild(renderPlannedCard(s));
      });

    } catch (err) {
      document.getElementById('banner').innerHTML = `
        <div class="status-banner some-down">
          <div class="status-dot dot-red"></div>
          <div><div class="banner-title">Could not load status data</div>
          <div class="banner-sub">Please refresh the page.</div></div>
        </div>`;
      document.getElementById('services').innerHTML = '';
    }
  }

  function escHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function extractServiceName(title) {
    return title
      .replace(/^[\u{1F300}-\u{1FFFF}\u{2600}-\u{27BF}︀-️\s]*/u, '')
      .replace(/\s+(is down|is degraded|has degraded performance|is slow|is up).*$/i, '')
      .replace(/\s*\(.*\)\s*$/, '')
      .trim();
  }

  function fmtDuration(start, end) {
    const mins = Math.round((new Date(end) - new Date(start)) / 60000);
    if (mins < 60) return mins + ' min';
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `${h}h ${m}m` : `${h}h`;
  }

  async function loadPastIncidents() {
    const el = document.getElementById('past-incidents');
    try {
      const allIssues = await fetch(
        'https://api.github.com/repos/Dino-Dan/salaaz-status/issues?state=closed&per_page=20&sort=created&direction=desc'
      ).then(r => r.json());

      if (!Array.isArray(allIssues)) throw new Error('bad response');

      // Drop incidents for internal-only services before the cutoff filter, so
      // the empty state below is accurate when the only recent incidents were theirs.
      const publicIssues = allIssues.filter(
        i => !HIDDEN_SERVICE_NAMES.includes(extractServiceName(i.title || ''))
      );

      // Keep only incidents closed within the last 14 days
      const cutoff = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000);
      const issues = publicIssues.filter(i => i.closed_at && new Date(i.closed_at) >= cutoff);

      if (issues.length === 0) {
        el.innerHTML = '<div class="no-past-incidents">No incidents in the past 14 days.</div>';
        return;
      }

      const groups = new Map();
      issues.forEach(issue => {
        const d = new Date(issue.closed_at);
        const key = d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(issue);
      });

      let html = '';
      groups.forEach((dayIssues, key) => {
        const d = new Date(key + 'T12:00:00');
        const dayLabel = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        html += `<div class="incident-day-heading">${dayLabel}</div>`;
        dayIssues.forEach(issue => {
          const name = extractServiceName(issue.title);
          const dur = fmtDuration(issue.created_at, issue.closed_at);
          const dateShort = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const isDegraded = /degrad/i.test(issue.title);
          const dotColor = isDegraded ? '#2F4A1C' : '#8E3A47';
          html += `<div class="incident-row">
            <div class="incident-row-left">
              <div class="incident-dot" style="background:${dotColor}"></div>
              <div>
                <div class="incident-service">${escHtml(name)}</div>
                <div class="incident-detail">Resolved · ${dur} impact</div>
              </div>
            </div>
            <div class="incident-meta">${dateShort}</div>
          </div>`;
        });
      });
      el.innerHTML = html;
    } catch (e) {
      el.innerHTML = '<div class="no-past-incidents">Could not load incident history.</div>';
    }
  }

  init();
  loadPastIncidents();

  // Re-fetch status data every 5 minutes to match Upptime's check interval
  setInterval(() => { init(); loadPastIncidents(); }, 5 * 60 * 1000);
</script>
