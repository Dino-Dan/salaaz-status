# Test gate for the hand-built status page.
#
# The suite in tests/ used to be local-only — nothing ran it, and a push to
# status-page/** deployed straight to production ungated. This workflow is the
# gate; deploy-status-page.yml depends on it via `needs: test`.
#
# The e2e specs load status-page/*.html over file:// and mock every network
# request, so there is no server to start.

name: Tests

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "status-page/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm install` with no lockfile committed — see .gitignore. A lockfile
      # generated on macOS records only that platform's optional binaries, and
      # npm will not backfill @rollup/rollup-linux-x64-gnu for the runner
      # (npm/cli#4828), so `npm ci` exits 0 having installed no usable rollup
      # and vitest then dies at transform time.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Output is echoed back as ::error:: annotations. Actions log downloads
      # require admin rights, so without this a red run is opaque to anyone
      # without repo admin — including automation.
      - name: Unit tests
        run: |
          set -o pipefail
          if ! npm run test:unit 2>&1 | tee unit.log; then
            echo "::group::unit failure"
            tail -60 unit.log | while IFS= read -r line; do
              printf '::error::%s\n' "${line//$'\r'/}"
            done
            echo "::endgroup::"
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
