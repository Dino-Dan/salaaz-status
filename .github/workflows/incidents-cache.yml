name: Incidents Cache
on:
  # The `*/10` cron below is nominal only. Measured gaps between actual runs on
  # this repo: 99, 110, 146, 180, 269, 319, 313 minutes — up to 5.3 HOURS. That
  # is how long a new incident could take to reach status.salaaz.com, which for a
  # status page is the worst possible time to be stale.
  #
  # `render-smoke` is included deliberately: cron-job.org already sends that
  # event every ~10 minutes for the browser checks, so listening to it gives this
  # workflow a reliable external heartbeat at exactly its intended cadence,
  # without needing a new cron job configured. Same fix as synthetic-api and
  # render-smoke, which run on time because they are dispatch-driven.
  repository_dispatch:
    types: [incidents-cache, render-smoke]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: status-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cache:
    name: Snapshot issue history for the status page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Pull latest
        run: git pull --rebase

      - name: Fetch issues with an authenticated token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          curl -sf --max-time 15 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Dino-Dan/salaaz-status/issues?state=all&per_page=100&sort=created&direction=desc" \
            -o history/incidents.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/incidents.json
          git diff --cached --quiet || git commit -m "ci: update incidents cache"
          git pull --rebase
          git push
