# The single writer of the gh-pages branch.
#
# status.salaaz.com serves the hand-built pages in status-page/ — NOT Upptime's
# generated Sapper site. Nothing used to deploy them on push, so changes only
# reached production as collateral of design-guard.yml's recovery loop, which
# left the stock Upptime template live for 18 min to 3h39m at a time.
#
# If you add a file to status-page/, add a matching `cp` line below.

name: Deploy Custom Status Page
on:
  push:
    branches: [master]
    paths:
      - "status-page/**"
      - "scripts/**"
      # feed.xml and the JSON API are generated from these, so they need to
      # redeploy when an incident opens or closes. Deliberately NOT watching the
      # per-service .yml files or summary.json — those change on every 5-minute
      # uptime run and would turn this into a near-continuous deploy.
      - "history/incidents.json"
      # This file decides what gets published, so a change to it must republish.
      - ".github/workflows/deploy-status-page.yml"
  repository_dispatch:
    types: [deploy_status_page]
  schedule:
    # Reconcile gh-pages against master. GitHub's scheduler is unreliable on
    # this repo, so treat this as a fallback — prefer driving the
    # deploy_status_page dispatch above from cron-job.org.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Shared with design-guard.yml and ethics-smoke.yml so repo writers serialise
# instead of racing each other.
concurrency:
  group: status-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Gate real content changes on the suite. Deliberately skipped for the
  # scheduled reconcile and the dispatch recovery path — those republish content
  # that already passed on its way into master, and must not be blocked from
  # repairing a clobbered gh-pages by an unrelated test failure.
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml

  deploy:
    name: Publish status-page to gh-pages
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate feed + API
        run: |
          set -e
          mkdir -p build
          node scripts/build-feed.mjs build
          node scripts/build-api.mjs build

      - name: Publish to gh-pages
        run: |
          set -e
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git fetch origin gh-pages --quiet
          WORKDIR="$(mktemp -d)"
          git worktree add --detach "$WORKDIR" origin/gh-pages
          cd "$WORKDIR"
          git rm -rf --quiet .
          cp "$GITHUB_WORKSPACE/status-page/index.html" .
          cp "$GITHUB_WORKSPACE/status-page/incidents.html" .
          cp "$GITHUB_WORKSPACE/status-page/vendor-portal.svg" .
          cp "$GITHUB_WORKSPACE/build/feed.xml" .
          cp "$GITHUB_WORKSPACE/build/status.json" .
          cp "$GITHUB_WORKSPACE/build/summary.json" .
          echo "status.salaaz.com" > CNAME
          touch .nojekyll
          git add -A
          # Only commit when content actually changed — the 6-hourly reconcile
          # would otherwise push an empty commit every run.
          git diff --cached --quiet || git commit -q -m "deploy: status page from ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:gh-pages
