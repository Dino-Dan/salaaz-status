# Browser render checks for all three production sites.
#
# Replaces vendor-smoke.yml and ethics-smoke.yml, which were byte-identical
# clones each asserting only that SOME <form> was visible. salaaz.com — the
# revenue-bearing storefront — had no render check at all, which is part of why
# the 2026-08-26 empty-catalog incident ran for ~30 minutes unnoticed.
#
# A matrix is what lets a third site be added without a third copy of the file.
#
# This tier is slow (~2-3 min/run, browser download dominates), so it runs on a
# ~15 min cadence. The fast data-level assertions live in synthetic-api.yml and
# run every 1-2 min — that is the one that catches an empty catalog quickly.

name: Render Smoke

on:
  repository_dispatch:
    types: [render-smoke, vendor-push, ethics-push]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Own group, for the same reason synthetic-api.yml has one: sharing
# `status-repo-write` with the deploy and the other repo writers meant runs
# queued behind them and were cancelled by the next dispatch before executing.
concurrency:
  group: render-smoke
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  render:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One broken site must not mask the others. Running in parallel (rather
      # than the serialised 6-9 min this used to take) keeps a run short enough
      # that the next dispatch never lands on top of it; the commit step below
      # only writes on a real status change and retries on a lost race.
      fail-fast: false
      matrix:
        include:
          - site: marketplace
            name: Salaaz Marketplace
            slug: marketplace-render
            file: history/marketplace-render-status.json
          - site: vendor
            name: Vendor Portal
            slug: vendor-portal-render
            file: history/vendor-portal-render-status.json
          - site: ethics
            name: Ethics Dashboard
            slug: ethics-dashboard-render
            file: history/ethics-render-status.json
    steps:
      # See synthetic-api.yml: on repository_dispatch, checkout leaves a detached
      # HEAD and the push has no branch. This is what made the Marketplace leg
      # fail all 5 push attempts on 2026-08-28.
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Pull latest
        run: git pull --rebase

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The old key was a bare `playwright-chromium-v1` with no restore-keys and
      # no version input. actions/cache only writes on a miss, so it froze at
      # whatever revision existed when first populated: every run then re-download
      # ed Chromium while the stale entry was never refreshed. Keying on the
      # resolved Playwright version makes the cache actually work.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
          restore-keys: playwright-chromium-

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@${{ steps.pw.outputs.version }} --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Wait for deploy to propagate
        if: github.event_name == 'repository_dispatch'
        run: sleep 180

      - name: Render check
        id: render
        continue-on-error: true # a degraded site must still record + alert
        run: node scripts/render-check.mjs ${{ matrix.site }}

      # Writes only on a real status transition. The old workflows rewrote
      # lastUpdated every run, so every run committed — pure churn that kept the
      # repo write-busy for no information gain.
      - name: Commit result on change
        run: |
          STATUS=$([ "${{ steps.render.outputs.healthy }}" = "true" ] && echo up || echo degraded)
          PREV=$(jq -r '.status // empty' ${{ matrix.file }} 2>/dev/null || true)
          if [ "$PREV" = "$STATUS" ]; then
            echo "${{ matrix.site }} still $STATUS — nothing to commit."
            exit 0
          fi
          echo "${{ matrix.site }}: $PREV -> $STATUS"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          echo "{\"status\":\"$STATUS\",\"lastUpdated\":\"$TIMESTAMP\"}" > ${{ matrix.file }}
          git add ${{ matrix.file }}
          git diff --cached --quiet && exit 0
          git commit -q -m "ci: ${{ matrix.site }} render -> $STATUS"
          # The old smoke workflows pushed without pulling first, unlike every
          # other writer here. Now the matrix legs also run in parallel, so a
          # lost race is expected rather than exceptional — retry it.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet && git push --quiet origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push ${{ matrix.site }} render status after 5 attempts."
          exit 1

      - name: Alert on render failure
        uses: ./.github/actions/alert-issue
        with:
          slug: ${{ matrix.slug }}
          name: ${{ matrix.name }} render check
          healthy: ${{ steps.render.outputs.healthy }}
          detail: ${{ steps.render.outputs.detail }}
          token: ${{ secrets.GH_PAT || github.token }}
