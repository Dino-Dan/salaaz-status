# Functional checks against the live storefront API.
#
# Exists because of 2026-08-26: salaaz.com served HTTP 200 for ~30 minutes while
# showing no products, and every monitor stayed green. nginx's
# `try_files ... /index.html` returns 200 for ANY path, so a status-code check on
# the frontend proves almost nothing — these assertions look at the data instead.
#
# Fast by design (no browser, ~2s of probing) so it can run every 1-2 minutes.
#
# TRIGGERING: GitHub's scheduler drifts badly on this repo — a nominal */15 cron
# was measured firing every 17-58 minutes. For "alert us immediately" to mean
# anything, drive the `synthetic` repository_dispatch from cron-job.org every
# 1-2 min, the same way deploy-status-page.yml recommends. The cron below is only
# a backstop for when the external trigger dies.

name: Synthetic API Checks

on:
  repository_dispatch:
    types: [synthetic]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      notification_test:
        description: "Fire a test alert to prove the Discord path works (does not touch the public status page)"
        type: boolean
        default: false

# Its OWN group, deliberately. The first deployment put this in the shared
# `status-repo-write` group alongside Render Smoke (2-3 min) and the deploy
# workflow; every fast run queued behind them and was then cancelled by the next
# dispatch, so nothing ever executed. A 1-2 minute check cannot share a lock with
# multi-minute jobs.
concurrency:
  group: synthetic-api
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    name: Probe storefront API
    runs-on: ubuntu-latest
    steps:
      # `ref: master` is required, not cosmetic: on repository_dispatch (the
      # primary trigger here) actions/checkout leaves a detached HEAD, and a bare
      # `git push` then has no branch to push to. deploy-status-page.yml already
      # checks out master explicitly for the same reason.
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Pull latest
        run: git pull --rebase

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner exits non-zero only if IT breaks; "degraded" is a normal
      # result reported via outputs. It re-probes once after 30s on failure to
      # absorb deploy asset-swap windows and one-off network blips (a live dry
      # run hit a spurious `fetch failed` on a healthy site).
      - name: Run checks
        id: checks
        run: node scripts/run-synthetic.mjs --state history/synthetic-status.json

      # Who watches the watchman. On 2026-09-02 the checks fired perfectly and
      # nobody was told, because delivery had never been exercised end to end —
      # a silent notification path is indistinguishable from a healthy one.
      # This makes the delivery path testable on demand instead of only during a
      # real outage. Manual dispatch only; uses its own slug so it can never
      # collide with a genuine storefront alert, and never touches the public page.
      # Two ways in: tick `notification_test` on a manual dispatch, or commit a
      # `notify-test.flag` file at the repo root (which works on the routine
      # 2-minute dispatch, so no Actions UI access is needed).
      #
      # Deliberately NOT gated with `if:`. Gating on the flag would mean removing
      # it SKIPS this step — alert-issue would never run with healthy=true, the
      # test issue would never close, and no recovery message would fire. Health
      # is derived from the flag instead, so the test cleans up after itself in
      # both directions and can never strand an open issue.
      #
      # Plain filename, not a dotfile: hashFiles() globs, and dotfiles are
      # commonly excluded, which would silently turn this into a no-op.
      - name: Notification self-test
        if: ${{ !cancelled() }}
        uses: ./.github/actions/alert-issue
        with:
          slug: notification-self-test
          name: Notification self-test
          title: "🧪 [internal] Notification self-test — ignore, this is not an outage"
          healthy: ${{ !inputs.notification_test && hashFiles('notify-test.flag') == '' }}
          detail: "Deliberate test of the Discord delivery path. Remove notify-test.flag (or let the manual dispatch finish) to send the matching recovery message."
          token: ${{ secrets.GH_PAT || github.token }}
          discord_webhook: ${{ secrets.NOTIFICATION_DISCORD_WEBHOOK_URL }}

      # BEFORE the commit step, deliberately. This ordering was the other way
      # round and it is a latent outage-swallower: the commit step only runs when
      # the status CHANGES — i.e. at the exact moment an incident starts — and a
      # failing step skips everything after it, so a lost push race would have
      # eaten the alert on the one run that mattered. Verified on render-smoke,
      # where the same shape produced `failure Commit / skipped Alert`.
      #
      # !cancelled() not always(): a cancelled run has empty outputs, and
      # alert-issue treats anything but "true" as failing, so always() would page
      # on every concurrency cancellation.
      - name: Alert on storefront functional failure
        if: ${{ !cancelled() }}
        uses: ./.github/actions/alert-issue
        with:
          slug: storefront-functional
          name: Salaaz Marketplace functional checks
          title: "🛒 [internal] Storefront functional checks failing — customers may see a broken site"
          healthy: ${{ steps.checks.outputs.healthy }}
          detail: "Failing: ${{ steps.checks.outputs.failing }}. ${{ steps.checks.outputs.detail }}"
          token: ${{ secrets.GH_PAT || github.token }}
          discord_webhook: ${{ secrets.NOTIFICATION_DISCORD_WEBHOOK_URL }}

      # Only when the status actually changed — in steady state this is a no-op,
      # which is the point: at this cadence a commit per run would be ~720/day.
      # Retries because this no longer holds the shared repo-write lock, so a
      # concurrent push from another workflow can reject it.
      - name: Commit result
        if: ${{ !cancelled() && steps.checks.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/synthetic-status.json
          git diff --cached --quiet && { echo "Nothing staged."; exit 0; }
          git commit -q -m "ci: synthetic status -> ${{ steps.checks.outputs.healthy == 'true' && 'up' || 'degraded' }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet && git push --quiet origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push synthetic status after 5 attempts."
          exit 1
