<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidents — Salaaz Status</title>
  <meta name="description" content="Full incident history for all Salaaz services — Marketplace and Vendor Portal.">
  <meta property="og:title" content="Incidents — Salaaz Status">
  <meta property="og:description" content="Full incident history for all Salaaz services.">
  <meta property="og:url" content="https://status.salaaz.com/incidents.html">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://salaaz.com/logo.png">
  <link rel="canonical" href="https://status.salaaz.com/incidents.html">
  <link rel="alternate" type="application/atom+xml" title="Salaaz Status — Incidents" href="/feed.xml">
  <link rel="icon" type="image/png" href="https://salaaz.com/favicon.ico">
  <script>
    (function () {
      var t = localStorage.getItem('salaaz-theme');
      if (t !== 'dark' && t !== 'olive') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.classList.add(t === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink-1: #1A2E0F;
      --ink-2: #2F4A1C;
      --ink-3: #5C6F4A;
      --paper-1: #FAF8F2;
      --paper-2: #F3EFE3;
      --paper-3: #E8E2CE;
      --leaf-50: #EAF3DE;
      --leaf: #4F7A1B;
      --leaf-deep: #2C5F2D;
      --rose: #8E3A47;
      --rose-soft: #F1E0E4;
      --amber: #C68B3C;
      --amber-deep: #8B6332;
      --amber-soft: #F5E6CE;
      --rule: rgba(26,46,15,0.12);
      --rule-2: rgba(26,46,15,0.22);
      --focus-ring: 0 0 0 3px rgba(44,95,45,0.12);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    [data-theme="dark"] {
      --ink-1: #F0EAD4;
      --ink-2: #D9D2BC;
      --ink-3: #ACA98E;
      --paper-1: #0F1A09;
      --paper-2: #16240F;
      --paper-3: #1F3017;
      --leaf-50: rgba(151,196,89,0.16);
      --leaf: #97C459;
      --leaf-deep: #6FA53C;
      --rose: #D8829A;
      --rose-soft: rgba(216,130,154,0.18);
      --amber: #E0A658;
      --amber-deep: #E0A658;
      --amber-soft: rgba(224,166,88,0.18);
      --rule: rgba(240,234,212,0.12);
      --rule-2: rgba(240,234,212,0.22);
      --focus-ring: 0 0 0 3px rgba(151,196,89,0.22);
    }

    [data-theme="olive"] {
      --ink-1: #1C2415;
      --ink-2: #38432A;
      --ink-3: #5C6650;
      --paper-1: #F4F8F0;
      --paper-2: #EAF1E2;
      --paper-3: #DCE7CE;
      --leaf-50: #E6F0D8;
      --leaf: #6B8E23;
      --leaf-deep: #556B2F;
      --amber: #C0922E;
    }

    html, body {
      background: var(--paper-1);
      color: var(--ink-1);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }

    nav {
      background: var(--paper-2);
      border-bottom: 0.5px solid var(--rule-2);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-links a {
      font-size: 0.8rem;
      color: var(--ink-3);
      text-decoration: none;
      font-weight: 500;
      margin-left: 1.25rem;
      transition: color 120ms linear;
    }
    .nav-links a:hover { color: var(--ink-1); }
    .nav-links a.active { color: var(--ink-1); }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin-left: 1.25rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink-1);
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 120ms linear, color 120ms linear;
    }
    .theme-toggle:hover { background: var(--paper-3); }
    .theme-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .theme-toggle svg { display: block; }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--ink-1);
      text-decoration: none;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .page-title { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 500; letter-spacing: -0.005em; }

    .back-link {
      font-size: 0.8rem;
      color: var(--ink-3);
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { color: var(--ink-1); }

    .section-label {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.6rem;
    }

    .incident-group { margin-bottom: 2rem; }

    .incident-day {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--ink-2);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      border-bottom: 0.5px solid var(--rule);
    }

    .incident-card {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      user-select: none;
      transition: border-color 120ms linear;
    }
    .incident-card:hover { border-color: var(--rule-2); }
    .incident-card.is-open   { border-left: 3px solid var(--rose); }
    .incident-card.is-closed { border-left: 3px solid var(--leaf); }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-left { min-width: 0; }

    .card-service {
      font-family: var(--font-serif);
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-time {
      font-size: 0.72rem;
      color: var(--ink-3);
      margin-top: 0.15rem;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 500;
      padding: 0.25em 0.6em;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 0.5px solid transparent;
    }
    .badge-ongoing  { background: var(--rose-soft); color: var(--rose); border-color: rgba(142,58,71,0.18); }
    .badge-resolved { background: var(--leaf-50); color: var(--leaf-deep); border-color: rgba(44,95,45,0.16); }

    .chevron {
      font-size: 0.7rem;
      color: var(--ink-3);
      transition: transform 120ms linear;
      flex-shrink: 0;
    }
    .chevron.open { transform: rotate(180deg); }

    .card-details {
      display: none;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 0.5px solid var(--rule);
    }
    .card-details.visible { display: block; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.78rem;
      color: var(--ink-2);
      padding: 0.2rem 0;
      gap: 1rem;
    }

    .detail-label {
      color: var(--ink-3);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 120px;
    }

    .no-incidents {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--ink-3);
      font-size: 0.875rem;
    }

    .skeleton-card {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.5rem;
    }
    .skeleton-line {
      border-radius: 4px;
      background: linear-gradient(90deg, var(--paper-3) 25%, #DDD6BC 50%, var(--paper-3) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    footer {
      border-top: 0.5px solid var(--rule-2);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-3);
      margin-top: 3rem;
    }
    footer a { color: var(--ink-3); text-decoration: none; }
    footer a:hover { color: var(--ink-1); }

    @media (max-width: 600px) {
      main { padding: 1.25rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <img src="https://salaaz.com/logo.png" alt="Salaaz" style="height:24px;width:auto;">
    Salaaz Status
  </a>
  <div class="nav-links">
    <a href="/">Status</a>
    <a href="incidents.html" class="active">Incidents</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"></button>
  </div>
</nav>

<main>
  <div class="page-header">
    <div class="page-title">All Incidents</div>
    <a class="back-link" href="/">← Back to Status</a>
  </div>

  <div id="ongoing-section" style="display:none">
    <div class="section-label">Active Incidents</div>
    <div id="ongoing-list"></div>
    <div style="margin-bottom:2rem"></div>
  </div>

  <div class="section-label">History</div>
  <div id="incidents">
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:55%;margin-bottom:8px"></div>
      <div class="skeleton-line" style="height:11px;width:30%"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:65%;margin-bottom:8px"></div>
      <div class="skeleton-line" style="height:11px;width:25%"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:50%;margin-bottom:8px"></div>
      <div class="skeleton-line" style="height:11px;width:35%"></div>
    </div>
  </div>
</main>

<footer>© 2026 <a href="https://salaaz.com" target="_blank" rel="noopener">Salaaz</a> · <a href="/feed.xml">RSS</a> · <a href="/status.json">API</a></footer>

<script>
  // ── Theme toggle (light → dark → olive → light) ──
  const THEME_KEY = 'salaaz-theme';
  const THEMES = ['light', 'dark', 'olive'];
  const THEME_ICONS = {
    light: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1"/><path d="M12 20v1"/><path d="M3 12h1"/><path d="M20 12h1"/><path d="m5.6 5.6.7.7"/><path d="m17.7 17.7.7.7"/><path d="m5.6 18.4.7-.7"/><path d="m17.7 6.3.7-.7"/></svg>',
    dark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>',
    olive: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c.5-4.5 2.5-8 7-10"/><path d="M9 18c6.218 0 10.5-3.288 11-12v-2h-4.014c-9 0-11.986 4-12 9 0 1 0 3 2 5h3z"/></svg>',
  };
  const THEME_LABELS = { light: 'Light theme', dark: 'Dark theme', olive: 'Olive theme' };

  function getTheme() {
    const t = localStorage.getItem(THEME_KEY);
    return THEMES.indexOf(t) !== -1 ? t : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      // Icon shows the theme a click will switch TO, matching webstore's sun/moon-swap convention.
      const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      btn.innerHTML = THEME_ICONS[next];
      btn.setAttribute('aria-label', 'Switch to ' + THEME_LABELS[next].toLowerCase());
      btn.title = THEME_LABELS[next];
    }
  }

  function setTheme(theme) {
    localStorage.setItem(THEME_KEY, theme);
    applyTheme(theme);
  }

  const themeToggleBtn = document.getElementById('theme-toggle');
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', function () {
      const current = getTheme();
      const next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
      setTheme(next);
    });
  }
  applyTheme(getTheme());

  // Served from a periodically-updated static snapshot (see .github/workflows/incidents-cache.yml)
  // rather than fetched from api.github.com directly — that endpoint caps unauthenticated
  // requests at 60/hour per IP, which is easy for real visitors to exhaust.
  const INCIDENTS_URL = 'https://raw.githubusercontent.com/Dino-Dan/salaaz-status/master/history/incidents.json';
  function cacheBust(url) { return url + '?_=' + Date.now(); }

  // Internal-only services — monitored and alerted on, but never listed publicly.
  const HIDDEN_SERVICE_NAMES = ['Ethics Dashboard'];

  // Issues opened by the smoke checks and third-party dependency pings purely so
  // the GitHub→Discord webhook alerts us. Never public — see index.html.
  const EXCLUDED_LABELS = ['internal'];

  // Maintenance is planned work, not an incident — see index.html.
  const NON_INCIDENT_LABELS = EXCLUDED_LABELS.concat(['maintenance']);

  function hasExcludedLabel(issue) {
    return (issue.labels || []).some(function (l) {
      return NON_INCIDENT_LABELS.indexOf(l.name || l) !== -1;
    });
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
    });
  }

  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function dayKey(iso) {
    const d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function dayLabel(iso) {
    return new Date(iso).toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  function duration(a, b) {
    const secs = Math.round((new Date(b) - new Date(a)) / 1000);
    if (secs < 60) return secs + 's';
    const mins = Math.floor(secs / 60), remS = secs % 60;
    if (mins < 60) return mins + 'm ' + (remS > 0 ? remS + 's' : '');
    const hrs = Math.floor(mins / 60), remM = mins % 60;
    return hrs + 'h ' + (remM > 0 ? remM + 'm' : '');
  }

  function serviceName(title) {
    let t = title.replace(/^[^\p{L}\p{N}]+/u, '').trim();
    for (const s of [' is down', ' is degraded', ' has degraded performance']) {
      if (t.toLowerCase().includes(s)) { t = t.slice(0, t.toLowerCase().indexOf(s)); break; }
    }
    return t.trim();
  }

  function statusCode(title) {
    const m = title.match(/\((\d+)\s+in/);
    return m ? m[1] : null;
  }

  function makeCard(issue) {
    const isOpen = issue.state === 'open';
    const service = serviceName(issue.title);
    const code = statusCode(issue.title);

    const card = document.createElement('div');
    card.className = 'incident-card ' + (isOpen ? 'is-open' : 'is-closed');
    // Stable anchor so an incident can be linked to directly — the feed's
    // per-entry links point here.
    if (issue.number != null) card.id = 'incident-' + issue.number;

    const top = document.createElement('div');
    top.className = 'card-top';

    const left = document.createElement('div');
    left.className = 'card-left';

    const svc = document.createElement('div');
    svc.className = 'card-service';
    svc.textContent = service;

    const time = document.createElement('div');
    time.className = 'card-time';
    time.textContent = isOpen ? fmtDateTime(issue.created_at) : fmtTime(issue.created_at);

    left.appendChild(svc);
    left.appendChild(time);

    const right = document.createElement('div');
    right.className = 'card-right';

    const badge = document.createElement('span');
    badge.className = 'badge ' + (isOpen ? 'badge-ongoing' : 'badge-resolved');
    badge.textContent = isOpen ? 'Active' : 'Resolved';

    const chev = document.createElement('span');
    chev.className = 'chevron';
    chev.textContent = '▾';

    right.appendChild(badge);
    right.appendChild(chev);

    top.appendChild(left);
    top.appendChild(right);
    card.appendChild(top);

    const details = document.createElement('div');
    details.className = 'card-details';

    function addRow(label, value) {
      const row = document.createElement('div');
      row.className = 'detail-row';
      const l = document.createElement('span');
      l.className = 'detail-label';
      l.textContent = label;
      const v = document.createElement('span');
      v.textContent = value;
      row.appendChild(l);
      row.appendChild(v);
      details.appendChild(row);
    }

    addRow('Degradation detected', fmtDateTime(issue.created_at));
    if (code) addRow('Status code', code);
    if (!isOpen && issue.closed_at) {
      addRow('Service restored', fmtDateTime(issue.closed_at));
      addRow('Duration of impact', duration(issue.created_at, issue.closed_at).trim());
    } else {
      addRow('Impact duration', duration(issue.created_at, new Date().toISOString()).trim());
    }

    // Deliberately no link out to the GitHub issue. Incidents are read here, on
    // the status page; sending visitors into the monitoring repo exposes internal
    // tooling and issue history that is not part of the story we are telling.
    // `issue.html_url` is available in the data and intentionally unused.

    card.appendChild(details);

    function toggleCard(force) {
      const open = details.classList.toggle('visible', force);
      chev.classList.toggle('open', open);
    }
    card.expand = function () { toggleCard(true); };
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.addEventListener('click', function () { toggleCard(); });
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCard(); }
    });

    return card;
  }

  async function init() {
    try {
      const allIssues = await fetch(
        cacheBust(INCIDENTS_URL)
      ).then(function(r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });

      // Drop incidents for internal-only services at a single point, so the
      // ongoing section, empty states and day groupings all stay consistent.
      const issues = allIssues.filter(function(i) {
        return !hasExcludedLabel(i) &&
          HIDDEN_SERVICE_NAMES.indexOf(serviceName(i.title || '')) === -1;
      });

      const ongoing  = issues.filter(function(i) { return i.state === 'open'; });
      // Outages under 5 minutes are treated as noise (e.g. deploy blips) and never shown.
      const resolved = issues.filter(function(i) {
        return i.state === 'closed' &&
          (new Date(i.closed_at) - new Date(i.created_at)) >= 5 * 60 * 1000;
      });

      const ongoingSection = document.getElementById('ongoing-section');
      const ongoingList    = document.getElementById('ongoing-list');
      if (ongoing.length > 0) {
        ongoingSection.style.display = 'block';
        ongoing.forEach(function(i) { ongoingList.appendChild(makeCard(i)); });
      }

      const incidentsEl = document.getElementById('incidents');
      incidentsEl.innerHTML = '';

      if (resolved.length === 0 && ongoing.length === 0) {
        incidentsEl.innerHTML = '<div class="no-incidents">No incidents recorded yet.</div>';
        return;
      }
      if (resolved.length === 0) {
        incidentsEl.innerHTML = '<div class="no-incidents">No resolved incidents yet.</div>';
        return;
      }

      const groups = new Map();
      resolved.forEach(function(issue) {
        const k = dayKey(issue.created_at);
        if (!groups.has(k)) groups.set(k, { label: dayLabel(issue.created_at), items: [] });
        groups.get(k).items.push(issue);
      });

      groups.forEach(function(group) {
        const section = document.createElement('div');
        section.className = 'incident-group';

        const heading = document.createElement('div');
        heading.className = 'incident-day';
        heading.textContent = group.label;
        section.appendChild(heading);

        group.items.forEach(function(i) { section.appendChild(makeCard(i)); });
        incidentsEl.appendChild(section);
      });

      // Test the unfiltered length — this notice means "the API page was full".
      if (allIssues.length === 100) {
        const cap = document.createElement('div');
        cap.style.cssText = 'text-align:center;font-size:0.78rem;color:var(--ink-3);padding:1.25rem 0 0;';
        cap.textContent = 'Showing the 100 most recent incidents.';
        incidentsEl.appendChild(cap);
      }

      revealHashTarget();

    } catch (err) {
      document.getElementById('incidents').innerHTML =
        '<div class="no-incidents">Could not load incident history.</div>';
    }
  }

  // Cards render asynchronously, so the browser's own #hash scroll has already
  // happened and found nothing. Re-resolve it once the list exists.
  function revealHashTarget() {
    const id = (location.hash || '').replace(/^#/, '');
    if (!id) return;
    const target = document.getElementById(id);
    if (!target) return;
    if (typeof target.expand === 'function') target.expand();
    target.scrollIntoView({ block: 'center' });
    target.focus({ preventScroll: true });
  }

  window.addEventListener('hashchange', revealHashTarget);

  init();
</script>
</body>
</html>
