<!-- salaaz-custom-status-page: do not let Upptime's generated Sapper site overwrite this on gh-pages -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salaaz Status</title>
  <meta name="description" content="Live status and uptime for all Salaaz services — Marketplace and Vendor Portal.">
  <meta property="og:title" content="Salaaz Status">
  <meta property="og:description" content="Live status and uptime for all Salaaz services.">
  <meta property="og:url" content="https://status.salaaz.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://salaaz.com/logo.png">
  <link rel="canonical" href="https://status.salaaz.com/">
  <link rel="alternate" type="application/atom+xml" title="Salaaz Status — Incidents" href="/feed.xml">
  <link rel="icon" type="image/png" href="https://salaaz.com/favicon.ico">
  <script>
    (function () {
      var t = localStorage.getItem('salaaz-theme');
      if (t !== 'dark' && t !== 'olive') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.classList.add(t === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink-1: #1A2E0F;
      --ink-2: #2F4A1C;
      --ink-3: #5C6F4A;
      --paper-1: #FAF8F2;
      --paper-2: #F3EFE3;
      --paper-3: #E8E2CE;
      --leaf-50: #EAF3DE;
      --leaf: #4F7A1B;
      --leaf-deep: #2C5F2D;
      --bridge-leaf: #639922;
      --rose: #8E3A47;
      --rose-soft: #F1E0E4;
      --amber: #C68B3C;
      --amber-deep: #8B6332;
      --amber-soft: #F5E6CE;
      --rule: rgba(26,46,15,0.12);
      --rule-2: rgba(26,46,15,0.22);
      --focus-ring: 0 0 0 3px rgba(44,95,45,0.12);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --salaaz-loader-color: var(--bridge-leaf);
      --workbench-loader-outer-fill: #DBB5A6;
      --workbench-loader-outer-stroke: #C68B7A;
      --workbench-loader-outer-opacity: 0.7;
      --workbench-loader-inner-stroke: #A85842;
    }

    [data-theme="dark"] {
      --ink-1: #F0EAD4;
      --ink-2: #D9D2BC;
      --ink-3: #ACA98E;
      --paper-1: #0F1A09;
      --paper-2: #16240F;
      --paper-3: #1F3017;
      --leaf-50: rgba(151,196,89,0.16);
      --leaf: #97C459;
      --leaf-deep: #6FA53C;
      --bridge-leaf: #639922;
      --rose: #D8829A;
      --rose-soft: rgba(216,130,154,0.18);
      --amber: #E0A658;
      --amber-deep: #E0A658;
      --amber-soft: rgba(224,166,88,0.18);
      --rule: rgba(240,234,212,0.12);
      --rule-2: rgba(240,234,212,0.22);
      --focus-ring: 0 0 0 3px rgba(151,196,89,0.22);
      --salaaz-loader-color: #97C459;
      --workbench-loader-outer-fill: #8E4E3C;
      --workbench-loader-outer-stroke: #A85842;
      --workbench-loader-outer-opacity: 0.85;
      --workbench-loader-inner-stroke: #D67B5E;
    }

    [data-theme="olive"] {
      --ink-1: #1C2415;
      --ink-2: #38432A;
      --ink-3: #5C6650;
      --paper-1: #F4F8F0;
      --paper-2: #EAF1E2;
      --paper-3: #DCE7CE;
      --leaf-50: #E6F0D8;
      --leaf: #6B8E23;
      --leaf-deep: #556B2F;
      --amber: #C0922E;
      --bridge-leaf: #6B8E23;
      --salaaz-loader-color: var(--bridge-leaf);
      --workbench-loader-inner-stroke: #C0922E;
    }

    html, body {
      background: var(--paper-1);
      color: var(--ink-1);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      background: var(--paper-2);
      border-bottom: 0.5px solid var(--rule-2);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--ink-1);
      text-decoration: none;
    }

    .nav-links a {
      font-size: 0.8rem;
      color: var(--ink-3);
      text-decoration: none;
      font-weight: 500;
      margin-left: 1.25rem;
      transition: color 120ms linear;
    }

    .nav-links a:hover { color: var(--ink-1); }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin-left: 1.25rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink-1);
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 120ms linear, color 120ms linear;
    }
    .theme-toggle:hover { background: var(--paper-3); }
    .theme-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .theme-toggle svg { display: block; }

    /* ── Layout ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Status Banner ── */
    .status-banner {
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      border: 0.5px solid;
    }

    .status-banner.all-up   { background: var(--leaf-50); border-color: var(--leaf); }
    .status-banner.some-down { background: var(--rose-soft); border-color: var(--rose); }
    .status-banner.degraded  { background: var(--amber-soft); border-color: var(--amber); }
    .status-banner.maintenance { background: var(--paper-2); border-color: var(--rule-2); }

    /* Upcoming windows sit above the live banner rather than replacing it — the
       current status still matters while maintenance is merely scheduled. */
    .maintenance-notice {
      border: 0.5px dashed var(--rule-2);
      background: var(--paper-2);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.82rem;
      color: var(--ink-2);
    }
    .maintenance-notice strong { font-weight: 500; color: var(--ink-1); }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .dot-green  { background: var(--leaf); }
    .dot-red    { background: var(--rose); }
    .dot-amber  { background: var(--amber); }
    .dot-grey   { background: var(--ink-3); }

    .banner-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: -0.005em;
    }

    .all-up .banner-title    { color: var(--leaf-deep); }
    .some-down .banner-title { color: var(--rose); }
    .degraded .banner-title  { color: var(--amber-deep); }

    .banner-sub {
      font-size: 0.8rem;
      color: var(--ink-3);
      margin-top: 1px;
    }

    /* ── Last checked ── */
    .last-checked {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      color: var(--ink-3);
      text-align: right;
      margin-bottom: 0.6rem;
    }

    /* ── Section label ── */
    .section-label {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 0.6rem;
    }

    /* ── Service Cards ── */
    .card {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      margin-bottom: 0.4rem;
      overflow: hidden;
      transition: border-color 120ms linear;
    }
    .card:hover { border-color: var(--rule-2); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
    }

    .service-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .service-icon {
      width: 32px;
      height: 32px;
      border-radius: 3px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .service-name {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.005em;
      color: var(--ink-1);
    }

    .service-url {
      font-size: 0.73rem;
      color: var(--ink-3);
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.25em 0.75em;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      border: 0.5px solid transparent;
    }

    .tag-up       { background: var(--leaf-50); color: var(--leaf-deep); border-color: rgba(44,95,45,0.16); }
    .tag-down     { background: var(--rose-soft); color: var(--rose); border-color: rgba(142,58,71,0.18); }
    .tag-degraded { background: var(--amber-soft); color: var(--ink-1); border-color: rgba(198,139,60,0.28); }

    /* ── Bar strip ── */
    .bar-section {
      padding: 0 1.25rem 0.9rem;
    }

    .bar-strip {
      display: flex;
      gap: 2px;
      height: 20px;
      overflow: hidden;
      width: 100%;
    }

    .bar {
      flex: 1 1 0;
      min-width: 0;
      border-radius: 2px;
      cursor: default;
      transition: opacity 0.1s;
    }

    .bar:hover { opacity: 0.7; }

    .bar-legend {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .bar-legend span {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      color: var(--ink-3);
    }

    .uptime-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .uptime-pct {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    /* ── Legend ── */
    .color-legend {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      color: var(--ink-3);
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Divider ── */
    hr {
      border: none;
      border-top: 0.5px solid var(--rule-2);
      margin: 2rem 0;
    }


    /* ── Skeleton loader ── */
    .skeleton-card {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.6rem;
    }

    .skeleton-line {
      border-radius: 4px;
      background: linear-gradient(90deg, var(--paper-3) 25%, #DDD6BC 50%, var(--paper-3) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      background: var(--ink-1);
      color: var(--paper-1);
      font-family: var(--font-sans);
      font-size: 0.68rem;
      padding: 0.3em 0.6em;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
      z-index: 1000;
      display: none;
    }

    /* ── Component toggle & panel ── */
    .card-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1.25rem;
      border-top: 0.5px solid var(--rule);
      cursor: pointer;
      user-select: none;
    }
    .card-toggle:hover { background: var(--paper-1); }

    .card-toggle-label {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink-3);
    }

    .card-toggle-chev {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--ink-3);
      border-bottom: 1.5px solid var(--ink-3);
      transform: rotate(45deg);
      transition: transform 120ms linear;
      flex-shrink: 0;
    }
    .card-toggle-chev.open { transform: rotate(-135deg); }

    .card-components {
      display: none;
      padding: 0.25rem 1.25rem 0.75rem;
      border-top: 0.5px solid var(--rule);
    }
    .card-components.visible { display: block; }

    .component-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.32rem 0;
      border-bottom: 0.5px solid var(--rule);
    }
    .component-row:last-child { border-bottom: none; }

    .component-name {
      font-size: 0.8rem;
      color: var(--ink-2);
    }

    .comp-badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 500;
      padding: 0.2em 0.55em;
      border-radius: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .comp-operational { background: var(--leaf-50); color: var(--leaf-deep); }
    .comp-degraded    { background: var(--amber-soft); color: var(--ink-1); }
    .comp-planned     { background: var(--paper-1); color: var(--ink-3); }
    .comp-unknown     { background: var(--paper-1); color: var(--ink-3); }


    /* ── Planned service card ── */
    .card.is-planned { opacity: 0.82; }
    .tag-planned { background: var(--paper-1); color: var(--ink-3); }

    /* ── Past Incidents ── */
    .incidents-section { margin-top: 2.5rem; }

    .incidents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .incidents-header .view-all {
      font-size: 0.78rem;
      color: var(--leaf-deep);
      text-decoration: none;
    }
    .incidents-header .view-all:hover { text-decoration: underline; }

    .incident-day-heading {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 1.1rem 0 0.5rem;
    }
    .incident-day-heading:first-child { margin-top: 0; }

    .incident-row {
      background: var(--paper-2);
      border: 0.5px solid var(--rule);
      border-radius: 12px;
      padding: 0.875rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: border-color 120ms linear;
    }
    .incident-row:hover { border-color: var(--rule-2); }
    .incident-row-left { display: flex; align-items: center; gap: 0.625rem; }
    .incident-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); flex-shrink: 0; }
    .incident-service { font-family: var(--font-serif); font-size: 0.9rem; font-weight: 500; color: var(--ink-1); }
    .incident-detail { font-size: 0.78rem; color: var(--ink-3); margin-top: 0.1rem; }
    .incident-meta { font-family: var(--font-sans); font-size: 0.72rem; color: var(--ink-3); white-space: nowrap; }
    .no-past-incidents { font-size: 0.8rem; color: var(--ink-3); padding: 1.5rem 0; text-align: center; }

    /* ── Footer ── */
    footer {
      border-top: 0.5px solid var(--rule-2);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-3);
      margin-top: 3rem;
    }

    footer a { color: var(--ink-3); text-decoration: none; }
    footer a:hover { color: var(--ink-1); }

    /* ── Pulsing dot for live incidents ── */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .dot-pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .dot-pulse { animation: none; } }

    @media (max-width: 600px) {
      main { padding: 1.25rem 1rem 3rem; }
      .card-header { padding: 0.875rem 1rem 0.625rem; }
      .bar-section { padding: 0 1rem 0.875rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <img src="https://salaaz.com/logo.png" alt="Salaaz" style="height:24px;width:auto;">
    Salaaz Status
  </a>
  <span id="nav-status-chip" style="font-size:0.72rem;font-weight:500;padding:0.2em 0.6em;border-radius:999px;display:none"></span>
  <div class="nav-links">
    <a href="incidents.html">Incidents</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"></button>
  </div>
</nav>

<div id="tooltip"></div>

<main>
  <div id="banner">
    <!-- skeleton banner -->
    <div style="height:68px;border-radius:8px;margin-bottom:1.5rem" class="skeleton-line"></div>
  </div>

  <div class="last-checked" id="last-checked"></div>

  <div id="services">
    <!-- skeleton cards -->
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:120px;margin-bottom:10px"></div>
      <div class="skeleton-line" style="height:20px;width:100%"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:140px;margin-bottom:10px"></div>
      <div class="skeleton-line" style="height:20px;width:100%"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:14px;width:130px;margin-bottom:10px"></div>
      <div class="skeleton-line" style="height:20px;width:100%"></div>
    </div>
  </div>

  <div class="color-legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background:var(--leaf)"></div>Operational
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:var(--amber)"></div>Degraded
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:var(--rose)"></div>Outage
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:var(--paper-3)"></div>No data
    </div>
  </div>

  <div class="incidents-section">
    <div class="incidents-header">
      <div class="section-label" style="margin-bottom:0">Past Incidents</div>
      <a class="view-all" href="incidents.html">View all →</a>
    </div>
    <div id="past-incidents">
      <div class="skeleton-card" style="height:52px;margin-bottom:0.5rem"></div>
      <div class="skeleton-card" style="height:52px"></div>
    </div>
  </div>

</main>

<footer>
  © 2026 <a href="https://salaaz.com" target="_blank" rel="noopener">Salaaz</a>
  · <a href="/feed.xml">RSS</a>
  · <a href="/status.json">API</a>
</footer>

<script>
  // ── Theme toggle (light → dark → olive → light) ──
  const THEME_KEY = 'salaaz-theme';
  const THEMES = ['light', 'dark', 'olive'];
  const THEME_ICONS = {
    light: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1"/><path d="M12 20v1"/><path d="M3 12h1"/><path d="M20 12h1"/><path d="m5.6 5.6.7.7"/><path d="m17.7 17.7.7.7"/><path d="m5.6 18.4.7-.7"/><path d="m17.7 6.3.7-.7"/></svg>',
    dark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>',
    olive: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c.5-4.5 2.5-8 7-10"/><path d="M9 18c6.218 0 10.5-3.288 11-12v-2h-4.014c-9 0-11.986 4-12 9 0 1 0 3 2 5h3z"/></svg>',
  };
  const THEME_LABELS = { light: 'Light theme', dark: 'Dark theme', olive: 'Olive theme' };

  function getTheme() {
    const t = localStorage.getItem(THEME_KEY);
    return THEMES.indexOf(t) !== -1 ? t : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      // Icon shows the theme a click will switch TO, matching webstore's sun/moon-swap convention.
      const next = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      btn.innerHTML = THEME_ICONS[next];

h-leaf-outer" transform="rotate(300 100 100)"/></g><g class="workbench-loader-inner"><use href="#workbench-leaf-inner" transform="rotate(30 100 100)"/><use href="#workbench-leaf-inner" transform="rotate(90 100 100)"/><use href="#workbench-leaf-inner" transform="rotate(150 100 100)"/><use href="#workbench-leaf-inner" transform="rotate(210 100 100)"/><use href="#workbench-leaf-inner" transform="rotate(270 100 100)"/><use href="#workbench-leaf-inner" transform="rotate(330 100 100)"/></g></svg>';

  function hideTip()      { tooltip.style.display = 'none'; }

  // ── Helpers ──
  function localDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function localToday() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function formatDisplay(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d)
      .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ── Bar status for a given date ──
  function dayStatus(dateStr, startDate, dailyMinutesDown, qualifyingDates) {
    const d = new Date(dateStr + 'T00:00:00Z');
    if (!startDate || d < startDate) return 'nodata';
    const mins = (dailyMinutesDown || {})[dateStr] || 0;
    if (mins <= 0) return 'up';
    if (qualifyingDates) {
      // Precise incident data is available — trust it as the authority on
      // whether this day is real, rather than Upptime's rounded-up minute count.
      if (!qualifyingDates.has(dateStr)) return 'up';
    } else if (mins < 5) {
      // No incident data to verify against (fetch failed) — fall back to the old numeric floor.
      return 'up';
    }
    if (mins >= 720) return 'down';
    return 'degraded';
  }

  function barColor(status) {
    return { up: 'var(--leaf)', degraded: 'var(--amber)', down: 'var(--rose)', nodata: 'var(--paper-3)' }[status];
  }

  function barLabel(dateStr, status, mins) {
    const d = formatDisplay(dateStr);
    if (status === 'nodata')   return `${d}: No data`;
    if (status === 'down')     return `${d}: Outage — ${mins} min down`;
    if (status === 'degraded') return `${d}: Degraded — ${mins} min down`;
    return `${d}: Operational`;
  }

  // ── Fetch live status + start date from history YAML ──
  // The individual YAML files are always written first by Upptime and are
  // more up-to-date than summary.json, which can hold a stale status from
  // a previous check cycle. We use the YAML status as the source of truth.
  function cacheBust(url) { return url + '?_=' + Date.now(); }

  async function fetchYamlData(slug) {
    try {
      const text = await fetch(cacheBust(`${RAW}/history/${slug}.yml`)).then(r => r.text());
      const startMatch        = text.match(/startTime:\s*(\S+)/);
      const statusMatch       = text.match(/^status:\s*(\S+)/m);
      const lastUpdatedMatch  = text.match(/lastUpdated:\s*(\S+)/);
      const responseTimeMatch = text.match(/responseTime:\s*(\d+)/);
      const startDate = startMatch ? (function() {
        const d = new Date(startMatch[1]);
        return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      })() : null;
      const lastUpdated  = lastUpdatedMatch  ? new Date(lastUpdatedMatch[1])  : null;
      const responseTime = responseTimeMatch ? Number(responseTimeMatch[1])   : null;
      return { startDate, status: statusMatch ? statusMatch[1] : null, lastUpdated, responseTime };
    } catch (_) {}
    return { startDate: null, status: null, lastUpdated: null, responseTime: null };
  }

  // ── Render one service card ──
  function renderCard(service, startDate, lastUpdated, responseTime, qualifyingDates) {
    const today = localToday();
    const dm = service.dailyMinutesDown || {};

    // Build 90-day array — use local date arithmetic (setDate, not setUTCDate)
    const days = [];
    for (let i = 89; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const ds = localDateStr(d);
      const status = dayStatus(ds, startDate, dm, qualifyingDates);
      const mins = dm[ds] || 0;
      days.push({ ds, status, mins });
    }

    // If the service is live-down/degraded but no downtime recorded yet for today
    // (incident still open), immediately show today's bar as amber and estimate elapsed mins
    const todayBar = days[days.length - 1];
    if (todayBar && todayBar.status === 'up' && service.status !== 'up') {
      todayBar.status = 'degraded';
      todayBar.live = true;
      if (lastUpdated) {
        todayBar.mins = Math.max(0, Math.round((Date.now() - lastUpdated.getTime()) / 60000));
        todayBar.liveTime = lastUpdated.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }
    }

    const isUp     = service.status === 'up';
    const isDown   = service.status === 'down';
    const tagClass = isUp ? 'tag-up' : isDown ? 'tag-down' : 'tag-degraded';
    const tagText  = isUp ? '✓ Operational' : isDown ? '✕ Down' : '⚠ Degraded';

    const card = document.createElement('div');
    card.className = 'card';

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';

    const hostname = (() => { try { return new URL(service.url).hostname; } catch(_) { return service.url; } })();

    const iconMarkup = service.slug === 'vendor-portal'
      ? VENDOR_PORTAL_ICON_SVG
      : service.slug === 'salaaz-marketplace'
      ? MARKETPLACE_ICON_SVG
      : `<img class="service-icon" src="${service.icon}" onerror="this.style.visibility='hidden'" alt="">`;

    // Wrap icon in fixed-size container so hiding it on error doesn't shift layout
    header.innerHTML = `
      <div class="service-info">
        <div style="width:32px;height:32px;flex-shrink:0">
          ${iconMarkup}
        </div>
        <div>
          <div class="service-name">${service.name}</div>
          <div class="service-url">${hostname}</div>
        </div>
      </div>
      <span class="tag ${tagClass}" aria-label="${service.name} status: ${tagText.replace(/^[✓✕⚠]\s/, '')}">${tagText}</span>
    `;

    // Bar section
    const barSection = document.createElement('div');
    barSection.className = 'bar-section';

    const strip = document.createElement('div');
    strip.className = 'bar-strip';
    strip.setAttribute('role', 'img');
    strip.setAttribute('aria-label', `90-day uptime chart for ${service.name}`);

    days.forEach(({ ds, status, mins, live, liveTime }) => {
      const tipText = live
        ? `${formatDisplay(ds)}: Incident in progress${liveTime ? ' since ' + liveTime : ''}`
        : status === 'nodata'
          ? `${formatDisplay(ds)}: Monitoring not started yet`
          : barLabel(ds, status, mins);

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.background = barColor(status);
      bar.setAttribute('tabindex', '0');
      bar.setAttribute('aria-label', tipText);
      bar.addEventListener('mouseenter', () => showTip(tipText));
      bar.addEventListener('mouseleave', hideTip);
      bar.addEventListener('focus',  () => showTip(tipText));
      bar.addEventListener('blur',   hideTip);
      strip.appendChild(bar);
    });

    const legend = document.createElement('div');
    legend.className = 'bar-legend';
    legend.innerHTML = '<span>90 days ago</span><span>Today</span>';

    // Uptime = (90 days − total downtime) / 90 days, clamped 0–100
    const downMins = days.reduce((sum, d) => sum + d.mins, 0);
    const uptime90 = Math.min(100, Math.max(0, (90 * 1440 - downMins) / (90 * 1440) * 100)).toFixed(2) + '%';
    const responseText = isDown
      ? '—'
      : responseTime != null
        ? `${responseTime} ms`
        : service.time
          ? `${service.time} ms avg`
          : null;

    const uptimeRow = document.createElement('div');
    uptimeRow.className = 'uptime-row';
    uptimeRow.innerHTML = responseText
      ? `<span class="uptime-pct">${responseText} · ${uptime90} uptime (90 d)</span>`
      : `<span class="uptime-pct">${uptime90} uptime (90 d)</span>`;

    barSection.appendChild(strip);
    barSection.appendChild(legend);
    barSection.appendChild(uptimeRow);

    card.appendChild(header);
    card.appendChild(barSection);

    // ── Expandable sub-components (disabled) ──
    // const components = SUB_COMPONENTS[service.slug] || [];
    // if (components.length) { appendComponentPanel(card, components, service.status); }

    return card;
  }

  // ── Scheduled maintenance ──
  // Windows are declared in the HTML comment of a `maintenance`-labelled issue
  // (see .github/ISSUE_TEMPLATE/maintenance-event.md) — the same block Upptime
  // reads to suppress its checks. Those issues are already in incidents.json, so
  // this costs no extra request.
  function parseMaintenance(issue) {
    const body = issue.body || '';
    const start = (body.match(/start:\s*(\S+)/) || [])[1];
    const end   = (body.match(/end:\s*(\S+)/) || [])[1];
    if (!start || !end) return null;
    const startAt = new Date(start), endAt = new Date(end);
    if (isNaN(startAt) || isNaN(endAt)) return null;
    return {
      startAt, endAt,
      title: (issue.title || 'Scheduled maintenance').replace(/^\[Scheduled Maintenance\]\s*/i, '').trim()
        || 'Scheduled maintenance',
    };
  }

  const MAINTENANCE_LOOKAHEAD_MS = 7 * 24 * 60 * 60 * 1000;

  function maintenanceWindows(issues, now) {
    const out = { active: [], upcoming: [] };
    if (!Array.isArray(issues)) return out;
    issues.forEach(issue => {
      if (!(issue.labels || []).some(l => (l.name || l) === 'maintenance')) return;
      const w = parseMaintenance(issue);
      if (!w) return;
      if (now >= w.startAt && now < w.endAt) out.active.push(w);
      else if (w.startAt > now && w.startAt - now <= MAINTENANCE_LOOKAHEAD_MS) out.upcoming.push(w);
    });
    out.active.sort((a, b) => a.endAt - b.endAt);
    out.upcoming.sort((a, b) => a.startAt - b.startAt);
    return out;
  }

  function fmtWindow(w) {
    const fmt = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    return `${w.startAt.toLocaleString('en-US', fmt)} – ${w.endAt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
  }

  // ── Functional-check overlay ──
  // Downgrade-only, and only once `publicDegraded` is set — the workflow holds
  // that back until two consecutive failed runs. The internal Discord alert
  // fires on the first failure, so the team is told fast while the public claim
  // waits for corroboration. On 2026-08-24 a broken dependency check published a
  // false "degraded" for 36 hours because it could not tell "the thing is
  // unhealthy" from "we could not tell"; this exists so that is harder to repeat.
  //
  // Never upgrades: a service Upptime already reports `down` stays `down`.
  function applySyntheticStatus(services, synthetic) {
    if (!synthetic || typeof synthetic !== 'object') return;
    services.forEach(function (service) {
      const entry = synthetic[service.slug];
      if (!entry || !entry.publicDegraded) return;
      if (service.status === 'down') return;
      service.status = 'degraded';
      service.syntheticDetail = entry.detail || null;
    });
  }

  // ── Render banner ──
  function renderBanner(services, maint) {
    const allUp        = services.every(s => s.status === 'up');
    const downCount    = services.filter(s => s.status === 'down').length;
    const degradedCount = services.filter(s => s.status === 'degraded').length;
    const el = document.getElementById('banner');
    const chip = document.getElementById('nav-status-chip');
    const windows = maint || { active: [], upcoming: [] };

    // An active window takes over the banner — it explains why services may be
    // intentionally unavailable, which the up/down states cannot.
    if (windows.active.length) {
      const w = windows.active[0];
      el.innerHTML = `<div class="status-banner maintenance">
        <div class="status-dot dot-grey"></div>
        <div>
          <div class="banner-title">Scheduled Maintenance In Progress</div>
          <div class="banner-sub">${escHtml(w.title)} · until ${escHtml(w.endAt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }))}</div>
        </div>
      </div>`;
      if (chip) { chip.textContent = '● Maintenance'; chip.style.color = 'var(--ink-2)'; chip.style.background = 'var(--paper-3)'; chip.style.display = ''; }
      return;
    }

    if (allUp) {
      el.innerHTML = `<div class="status-banner all-up">
        <div class="status-dot dot-green dot-pulse"></div>
        <div>
          <div class="banner-title">All Systems Operational</div>
          <div class="banner-sub">Live status and uptime for all Salaaz services.</div>
        </div>
      </div>`;
      if (chip) { chip.textContent = '● All systems operational'; chip.style.color = 'var(--leaf-deep)'; chip.style.background = 'var(--leaf-50)'; chip.style.display = ''; }
    } else if (downCount > 0) {
      let title = `${downCount} Service${downCount > 1 ? 's' : ''} Down`;
      if (degradedCount > 0) title += `, ${degradedCount} Degraded`;
      el.innerHTML = `<div class="status-banner some-down">
        <div class="status-dot dot-red dot-pulse"></div>
        <div>
          <div class="banner-title">${title}</div>
          <div class="banner-sub">We are investigating. <a href="incidents.html" style="color:inherit;text-decoration:underline;">View active incident →</a></div>
        </div>
      </div>`;
      if (chip) { chip.textContent = '● Outage'; chip.style.color = 'var(--rose)'; chip.style.background = 'var(--rose-soft)'; chip.style.display = ''; }
    } else {
      el.innerHTML = `<div class="status-banner degraded">
        <div class="status-dot dot-amber dot-pulse"></div>
        <div>
          <div class="banner-title">Some Systems Degraded</div>
          <div class="banner-sub">Performance may be affected. <a href="incidents.html" style="color:inherit;text-decoration:underline;">View active incident →</a></div>
        </div>
      </div>`;
      if (chip) { chip.textContent = '● Degraded'; chip.style.color = 'var(--amber-deep)'; chip.style.background = 'var(--amber-soft)'; chip.style.display = ''; }
    }

    // Upcoming windows are additive — the live status above still applies.
    if (windows.upcoming.length) {
      const w = windows.upcoming[0];
      el.insertAdjacentHTML('afterbegin',
        `<div class="maintenance-notice"><strong>Scheduled maintenance</strong> — ${escHtml(fmtWindow(w))}. ${escHtml(w.title)}</div>`);
    }
  }

  // ── Main ──
  // Returns the incidents.json payload (or null) so the caller can hand it to
  // loadPastIncidents() instead of fetching the same file a second time.
  async function init() {
    let incidentsRaw = null;
    try {
      const [summary, depsData, incidents, synthetic] = await Promise.all([
        fetch(cacheBust(`${RAW}/history/summary.json`)).then(r => {
          if (!r.ok) throw new Error('Failed to load summary');
          return r.json();
        }),
        fetchDepsStatus(),
        // Failure here shouldn't blank the whole page — fall back to null,
        // which tells dayStatus() to trust dailyMinutesDown alone (old behavior).
        fetch(cacheBust(`${RAW}/history/incidents.json`)).then(r => r.ok ? r.json() : null).catch(() => null),
        // Functional-check results (synthetic-api.yml). Absent or unreadable is
        // treated as "no opinion" — a missing file must never imply an outage.
        fetch(cacheBust(`${RAW}/history/synthetic-status.json`)).then(r => r.ok ? r.json() : null).catch(() => null),
      ]);
      incidentsRaw = incidents;

      // Per-service set of local YYYY-MM-DD dates with at least one qualifying
      // (>=5 min precise, resolved) incident on record. The bar chart only shows
      // a day as degraded/down when it's backed by a real incident here, so it
      // never disagrees with the Past Incidents list about the same event.
      let qualifyingDatesByService = null;
      if (Array.isArray(incidentsRaw)) {
        qualifyingDatesByService = {};
        incidentsRaw.filter(i => isQualifyingIncident(i) && !hasExcludedLabel(i)).forEach(issue => {
          const name = extractServiceName(issue.title || '');
          const ds = localDateStr(new Date(issue.created_at));
          if (!qualifyingDatesByService[name]) qualifyingDatesByService[name] = new Set();
          qualifyingDatesByService[name].add(ds);
        });
      }

      // Drop internal-only services before anything else touches the data —
      // this keeps their slugs out of the YAML fetches below, out of the
      // banner math, and out of the rendered cards.
      const visible = summary.filter(s => !HIDDEN_SLUGS.includes(s.slug));

      const yamlData = await Promise.all(visible.map(s => fetchYamlData(s.slug)));

      // Override summary.json status with the live YAML status — the YAML is
      // written first by Upptime and is never stale from a previous check cycle.
      visible.forEach(function (service, i) {
        if (yamlData[i].status) service.status = yamlData[i].status;
      });

      // A service can answer HTTP 200 while being useless to a customer — that
      // is exactly what happened on 2026-08-26, when the storefront served an
      // empty catalog for ~30 minutes with every status code green. Fold in the
      // functional checks so the page reflects what a customer actually sees.
      applySyntheticStatus(visible, synthetic);

      renderBanner(visible, maintenanceWindows(incidentsRaw, new Date()));

      // Report when Upptime actually ran its check, not when this page happened to
      // load — take the most recent lastUpdated across all services. Only fall back
      // to now if no YAML carried a timestamp.
      const shortFmt = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      const stamps = yamlData.map(d => d.lastUpdated).filter(Boolean);
      const checkedAt = stamps.length ? new Date(Math.max(...stamps.map(d => d.getTime()))) : new Date();
      document.getElementById('last-checked').textContent =
        'Last updated: ' + checkedAt.toLocaleString('en-US', shortFmt);

      const servicesEl = document.getElementById('services');
      servicesEl.innerHTML = '';
      visible.forEach((service, i) => {
        const qualifyingDates = qualifyingDatesByService
          ? (qualifyingDatesByService[service.name] || new Set())
          : null;
        const card = renderCard(service, yamlData[i].startDate, yamlData[i].lastUpdated, yamlData[i].responseTime, qualifyingDates);
        if (service.slug === 'salaaz-marketplace') {
          appendDepsPanel(card, depsData);
        }
        servicesEl.appendChild(card);
      });
      PLANNED_SERVICES.forEach(function (s) {
        servicesEl.appendChild(renderPlannedCard(s));
      });

    } catch (err) {
      document.getElementById('banner').innerHTML = `
        <div class="status-banner some-down">
          <div class="status-dot dot-red"></div>
          <div><div class="banner-title">Could not load status data</div>
          <div class="banner-sub">Please refresh the page.</div></div>
        </div>`;
      document.getElementById('services').innerHTML = '';
    }
    return incidentsRaw;
  }

  function escHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function extractServiceName(title) {
    return title
      .replace(/^[\u{1F300}-\u{1FFFF}\u{2600}-\u{27BF}︀-️\s]*/u, '')
      .replace(/\s+(is down|is degraded|has degraded performance|is slow|is up).*$/i, '')
      .replace(/\s*\(.*\)\s*$/, '')
      .trim();
  }

  function fmtDuration(start, end) {
    const mins = Math.round((new Date(end) - new Date(start)) / 60000);
    if (mins < 60) return mins + ' min';
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `${h}h ${m}m` : `${h}h`;
  }

  // A "real" incident: resolved, and lasted at least 5 minutes precisely.
  // Outages under 5 minutes are treated as noise (e.g. deploy blips) and never
  // shown — neither in the Past Incidents list nor as a degraded bar-chart day.
  // Shared by loadPastIncidents() and init()'s bar-chart data so the two never
  // disagree about which incidents are real.
  function isQualifyingIncident(issue) {
    return issue.state === 'closed' && !!issue.closed_at &&
      (new Date(issue.closed_at) - new Date(issue.created_at)) >= 5 * 60 * 1000;
  }

  // Served from a periodically-updated static snapshot (see .github/workflows/incidents-cache.yml)
  // rather than fetched from api.github.com directly — that endpoint caps unauthenticated
  // requests at 60/hour per IP, which is easy for real visitors to exhaust.
  // `prefetched` is the array init() already pulled this cycle — the two used to
  // fetch incidents.json independently, doubling the request count per refresh.
  // Falls back to its own fetch so the function still stands alone.
  async function loadPastIncidents(prefetched) {
    const el = document.getElementById('past-incidents');
    try {
      const allIssues = Array.isArray(prefetched)
        ? prefetched
        : await fetch(cacheBust(`${RAW}/history/incidents.json`)).then(r => r.json());

      if (!Array.isArray(allIssues)) throw new Error('bad response');

      // Drop incidents for internal-only services before the cutoff filter, so
      // the empty state below is accurate when the only recent incidents were theirs.
      const publicIssues = allIssues.filter(
        i => isQualifyingIncident(i) && !hasExcludedLabel(i) &&
          !HIDDEN_SERVICE_NAMES.includes(extractServiceName(i.title || ''))
      );

      // Keep only incidents closed within the last 14 days
      const cutoff = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000);
      const issues = publicIssues.filter(i => new Date(i.closed_at) >= cutoff);

      if (issues.length === 0) {
        el.innerHTML = '<div class="no-past-incidents">No incidents in the past 14 days.</div>';
        return;
      }

      const groups = new Map();
      issues.forEach(issue => {
        const d = new Date(issue.closed_at);
        const key = d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(issue);
      });

      let html = '';
      groups.forEach((dayIssues, key) => {
        const d = new Date(key + 'T12:00:00');
        const dayLabel = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        html += `<div class="incident-day-heading">${dayLabel}</div>`;
        dayIssues.forEach(issue => {
          const name = extractServiceName(issue.title);
          const dur = fmtDuration(issue.created_at, issue.closed_at);
          const dateShort = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const isDegraded = /degrad/i.test(issue.title);
          const dotColor = isDegraded ? 'var(--amber)' : 'var(--rose)';
          html += `<div class="incident-row">
            <div class="incident-row-left">
              <div class="incident-dot" style="background:${dotColor}"></div>
              <div>
                <div class="incident-service">${escHtml(name)}</div>
                <div class="incident-detail">Resolved · ${dur} impact</div>
              </div>
            </div>
            <div class="incident-meta">${dateShort}</div>
          </div>`;
        });
      });
      el.innerHTML = html;
    } catch (e) {
      el.innerHTML = '<div class="no-past-incidents">Could not load incident history.</div>';
    }
  }

  // One pass = one fetch of each source. init() hands its incidents.json payload
  // to loadPastIncidents() rather than letting it fetch the file again.
  async function refresh() {
    const incidents = await init();
    await loadPastIncidents(incidents);
  }

  refresh();

  // Re-fetch status data every 5 minutes to match Upptime's check interval
  setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
</html>
